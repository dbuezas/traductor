name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # to publish releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865" "cmake;4.1.2" > /dev/null

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/traductor.jks"
            echo "TRADUCTOR_KEYSTORE=$RUNNER_TEMP/traductor.jks" >> "$GITHUB_ENV"
          fi

      - name: Build
        env:
          TRADUCTOR_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          ./gradlew assembleRelease --console=plain
          cp app/build/outputs/apk/release/app-release.apk "traductor-1.0.$GITHUB_RUN_NUMBER.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: traductor-apk
          path: traductor-*.apk

      # every push to main becomes a release, only when signed with the app's key (so it updates)
      - name: Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.TRADUCTOR_KEYSTORE != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.$GITHUB_RUN_NUMBER" "traductor-1.0.$GITHUB_RUN_NUMBER.apk" \
            --title "v1.0.$GITHUB_RUN_NUMBER" --notes "$(git log -1 --format=%B)" --target "$GITHUB_SHA"
